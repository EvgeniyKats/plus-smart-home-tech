# множитель ADDRESS_1
delivery.config.delivery-values.warehouse-address1-multiply = 1.0

# множитель ADDRESS_2
delivery.config.delivery-values.warehouse-address2-multiply = 2.0

# множитель хрупких товаров
delivery.config.delivery-values.fragile-multiply = 0.2

# множитель веса
delivery.config.delivery-values.weight-multiply = 0.3

# множитель объема
delivery.config.delivery-values.volume-multiply = 0.2

# множитель улицы
delivery.config.delivery-values.different-street-multiply = 0.2